  - {name: coroot, phase: Active}
  - {name: default, phase: Active}
  - {name: external-secrets, phase: Active}
  - {name: flux-system, phase: Active}
  - {name: kube-node-lease, phase: Active}
  - {name: kube-public, phase: Active}
  - {name: kube-system, phase: Active}
  - {name: longhorn-system, phase: Active}
  - {name: lynq-system, phase: Active}
