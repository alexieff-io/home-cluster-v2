apiVersion: handoff.cluster-rebuild/v1
kind: SecretPrerequisiteInventory
metadata:
  containsSecretValues: false
  applicationCount: 35
securityBoundary:
  included:
    - ExternalSecret definitions
    - non-secret 1Password item and field references
    - SOPS ciphertext manifests
  excluded:
    - Age private keys
    - deploy private keys
    - kubeconfigs
    - Talos secrets
    - Cloudflare credential JSON
    - token files
    - decrypted SOPS content
    - plaintext Kubernetes Secret values
externalPrerequisites:
  - name: target-git-repository
    purpose: Flux source of truth and deploy-key registration when private
  - name: new-age-keypair
    purpose: Encrypt target SOPS manifests; private key is installed out-of-band
  - name: onepassword-vault
    purpose: Provide the existing ExternalSecret item and field references
  - name: cloudflare-account
    purpose: Provide DNS token and tunnel credentials when retaining external ingress
  - name: domain-name
    purpose: Populate target cluster.toml and Flux substitutions
applications:
  - id: arc-runners/gha-runner-scale-set
    externalSecrets:
      - name: arc-github-pat
        file: kubernetes/apps/arc-runners/gha-runner-scale-set/app/externalsecret.yaml
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        targetName: arc-github-pat
        remoteRefs:
          - secretKey: github_token
            key: arc-github-pat
            property: token
    secretReferences: []
    secretManifestFiles: []
    valuesFrom: []
    substituteFrom: []
  - id: cert-manager/cert-manager
    externalSecrets:
      - name: cert-manager-secret
        file: kubernetes/apps/cert-manager/cert-manager/app/externalsecret.yaml
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        targetName: cert-manager-secret
        remoteRefs:
          - secretKey: api-token
            key: cloudflare-api-token
            property: password
    secretReferences: []
    secretManifestFiles: []
    valuesFrom: []
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  - id: coroot/coroot
    externalSecrets:
      - name: coroot-license
        file: kubernetes/apps/coroot/coroot/app/externalsecret.yaml
        secretStoreRef:
