        targetName: coroot-license
        remoteRefs:
          - secretKey: license-key
            key: coroot
            property: license-key
    secretReferences: []
    secretManifestFiles: []
    valuesFrom: []
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  - id: default/argus-panoptes
    externalSecrets:
      - name: argus-panoptes
        file: kubernetes/apps/default/argus-panoptes/app/externalsecret.yaml
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        targetName: argus-panoptes-secrets
        remoteRefs:
          - secretKey: oracleApiKey
            key: argus-panoptes
            property: oracle_api_key
          - secretKey: heraldSlackWebhook
            key: argus-panoptes
            property: herald_slack_webhook
          - secretKey: flowApiJwtSecret
            key: argus-panoptes
            property: flow_api_jwt_secret
          - secretKey: clickhouseUser
            key: argus-panoptes
            property: clickhouse_user
          - secretKey: clickhousePassword
            key: argus-panoptes
            property: clickhouse_password
          - secretKey: flowApiLlmApiKey
            key: argus-panoptes
            property: flow_api_llm_api_key
    secretReferences: []
    secretManifestFiles: []
    valuesFrom:
      - file: kubernetes/apps/default/argus-panoptes/app/helmrelease.yaml
        kind: Secret
        name: argus-panoptes-secrets
        valuesKey: FLOW_API_JWT_SECRET
        targetPath: flowApi.secrets.FLOW_API_JWT_SECRET
      - file: kubernetes/apps/default/argus-panoptes/app/helmrelease.yaml
        kind: Secret
        name: argus-panoptes-secrets
        valuesKey: FLOW_API_CLICKHOUSE_USER
        targetPath: flowApi.secrets.FLOW_API_CLICKHOUSE_USER
      - file: kubernetes/apps/default/argus-panoptes/app/helmrelease.yaml
