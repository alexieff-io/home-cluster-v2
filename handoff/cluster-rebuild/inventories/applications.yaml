            key: coroot
            property: license-key
    secretReferences: []
    secretManifestFiles: []
    dependencies:
      - name: coroot-operator
        namespace: flux-system
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
    sourceReferences: []
    valuesFrom: []
