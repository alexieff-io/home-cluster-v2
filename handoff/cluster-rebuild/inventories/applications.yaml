apiVersion: handoff.cluster-rebuild/v1
kind: ApplicationInventory
metadata:
  count: 50
  sourcePattern: kubernetes/apps/*/*/ks.yaml
applications:
  - id: arc-runners/gha-runner-scale-set
    application: gha-runner-scale-set
    sourceFolder: arc-runners
    targetNamespace: arc-runners
    fluxNamespace: flux-system
    sourcePath: kubernetes/apps/arc-runners/gha-runner-scale-set
    payloadPath: payload/apps/arc-runners/gha-runner-scale-set
    status: migrate
    statePolicy: stateless
    resourceKinds:
      - ExternalSecret
      - HelmRelease
      - Kustomization
      - OCIRepository
    chartAndManifestSources:
      - kind: HelmRelease
        name: arc-runner-set
        file: kubernetes/apps/arc-runners/gha-runner-scale-set/app/helmrelease.yaml
        chartRef:
          kind: OCIRepository
          name: gha-runner-scale-set
      - kind: OCIRepository
        name: gha-runner-scale-set
        file: kubernetes/apps/arc-runners/gha-runner-scale-set/app/ocirepository.yaml
        url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
        interval: 15m
        ref:
          tag: 0.14.2
    images: []
    storageClasses: []
    persistenceEvidence: []
    routes: []
    externalSecrets:
      - name: arc-github-pat
        file: kubernetes/apps/arc-runners/gha-runner-scale-set/app/externalsecret.yaml
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        targetName: arc-github-pat
        remoteRefs:
          - secretKey: github_token
            key: arc-github-pat
            property: token
    secretReferences: []
    secretManifestFiles: []
    dependencies:
      - name: gha-runner-scale-set-controller
        namespace: flux-system
      - name: onepassword-secret-store
        namespace: flux-system
    substituteFrom: []
    sourceReferences: []
    valuesFrom: []
  - id: arc-systems/gha-runner-scale-set-controller
    application: gha-runner-scale-set-controller
    sourceFolder: arc-systems
    targetNamespace: arc-systems
    fluxNamespace: flux-system
    sourcePath: kubernetes/apps/arc-systems/gha-runner-scale-set-controller
    payloadPath: payload/apps/arc-systems/gha-runner-scale-set-controller
