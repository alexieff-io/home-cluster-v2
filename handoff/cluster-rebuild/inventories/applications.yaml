    statePolicy: stateless
    resourceKinds:
      - HelmRelease
      - Kustomization
      - OCIRepository
    chartAndManifestSources:
      - kind: HelmRelease
        name: gha-runner-scale-set-controller
        file: kubernetes/apps/arc-systems/gha-runner-scale-set-controller/app/helmrelease.yaml
        chartRef:
