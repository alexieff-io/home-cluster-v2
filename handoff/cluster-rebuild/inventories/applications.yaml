          kind: ClusterSecretStore
          name: onepassword
        targetName: cert-manager-secret
        remoteRefs:
          - secretKey: api-token
            key: cloudflare-api-token
            property: password
    secretReferences: []
    secretManifestFiles: []
    dependencies: []
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
    sourceReferences: []
    valuesFrom: []
  - id: coroot/coroot
    application: coroot
    sourceFolder: coroot
    targetNamespace: coroot
    fluxNamespace: flux-system
    sourcePath: kubernetes/apps/coroot/coroot
    payloadPath: payload/apps/coroot/coroot
    status: migrate
    statePolicy: stateless
