    payloadPath: payload/apps/coroot/coroot-operator
    status: migrate
    statePolicy: stateless
    resourceKinds:
      - HelmRelease
      - HelmRepository
      - Kustomization
    chartAndManifestSources:
      - kind: HelmRelease
        name: coroot-operator
        file: kubernetes/apps/coroot/coroot-operator/app/helmrelease.yaml
        chart:
          chart: coroot-operator
          version: 0.x
          sourceRef:
            kind: HelmRepository
            name: coroot
      - kind: HelmRepository
        name: coroot
        file: kubernetes/apps/coroot/coroot-operator/app/helmrepository.yaml
        url: https://coroot.github.io/helm-charts
        interval: 1h
    images: []
    storageClasses: []
    persistenceEvidence: []
    routes: []
    externalSecrets: []
    secretReferences: []
    secretManifestFiles: []
    dependencies: []
    substituteFrom: []
    sourceReferences:
      - file: kubernetes/apps/coroot/coroot-operator/app/helmrelease.yaml
        kind: HelmRepository
        name: coroot
    valuesFrom: []
