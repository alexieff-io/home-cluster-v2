    images: []
    storageClasses: []
    persistenceEvidence: []
    routes:
      - name: coroot-external
        file: kubernetes/apps/coroot/coroot/app/httproute-external.yaml
        hostnames:
          - coroot-ext.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
      - name: coroot
        file: kubernetes/apps/coroot/coroot/app/httproute.yaml
        hostnames:
          - coroot.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
