        file: kubernetes/apps/arc-systems/gha-runner-scale-set-controller/app/ocirepository.yaml
        url: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
        interval: 15m
        ref:
          tag: 0.14.2
    images: []
    storageClasses: []
    persistenceEvidence: []
    routes: []
    externalSecrets: []
    secretReferences: []
    secretManifestFiles: []
    dependencies: []
    substituteFrom: []
    sourceReferences: []
    valuesFrom: []
  - id: cert-manager/cert-manager
